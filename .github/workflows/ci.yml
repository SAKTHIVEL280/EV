# Lint, typecheck and test every component on Linux and Windows (CLAUDE.md §10.3–10.4).
name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.10"
  NODE_VERSION: "24"

jobs:
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check-versions

  core:
    name: Core (Python) / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  frontend:
    name: Frontend (Svelte/TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  rust:
    name: App (Rust) / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
      # Tests start the real Python core from core/.venv.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - run: uv sync --frozen
        working-directory: core
      # tauri::generate_context! embeds the built frontend.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: app
      - run: cargo fmt --check
        working-directory: app/src-tauri
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: app/src-tauri
      - run: cargo test --locked
        working-directory: app/src-tauri
      # End to end: the real app starts core, opens Settings through the same
      # command as the button, waits for core's settings on screen, then quits.
      # A hang (window deadlock, blocked shutdown) fails here via the watchdog.
      - name: Smoke test (app → core → Settings → quit)
        shell: bash
        run: |
          cargo build --locked --features custom-protocol
          run=(timeout 180)
          if [ "$RUNNER_OS" = Linux ]; then run+=(xvfb-run -a); fi
          EV_SMOKE_TEST=1 EV_DATA_DIR="$RUNNER_TEMP/ev-smoke" "${run[@]}" target/debug/ev
        working-directory: app/src-tauri
      - name: Smoke test logs
        if: failure()
        shell: bash
        run: cat "$RUNNER_TEMP"/ev-smoke/logs/*.log || true
      - name: Third-party notices and license policy
        if: runner.os == 'Linux'
        run: uv run --frozen python ../scripts/third-party-notices --check
        working-directory: core
