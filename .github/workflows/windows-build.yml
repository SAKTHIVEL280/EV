# Builds the Windows spike installer for testing on the Windows 11 laptop
# (Phase 0 spikes S1-S3, docs/ROADMAP.md). Unsigned; SmartScreen warns (beta policy).
name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.10"
  NODE_VERSION: "24"

jobs:
  installer:
    name: NSIS installer + spike kit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python scripts/check-versions
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - name: Build ev-core (PyInstaller onedir)
        shell: bash
        run: scripts/build-core
      - name: Locate the Visual C++ runtime (app-local copy for llama.cpp)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { throw "Visual C++ redistributable folder not found" }
          Write-Host "Using $($crt.FullName)"
          "VC_REDIST_DIR=$($crt.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Stage llama.cpp runtime
        shell: bash
        run: |
          scripts/stage-llama-runtime win-cpu-x64
          build/llama-runtime/llama-server.exe --version
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      # Installer-only resources (packaged core, llama.cpp runtime) live in a separate
      # config so plain cargo builds on Windows don't need them staged.
      - name: Build installer
        run: pnpm tauri build --config src-tauri/tauri.installer.conf.json
        working-directory: app
      - name: Assemble spike kit
        shell: bash
        run: |
          mkdir -p kit
          cp app/src-tauri/target/release/bundle/nsis/*.exe kit/
          cp bench/spikes/*.ps1 bench/spikes/README.md kit/
          cp scripts/llama-cpp.pins kit/
          (cd kit && sha256sum -- *.exe > SHA256SUMS.txt)
          ls -la kit
          du -b kit/*.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ev-windows-spike-kit
          path: kit/
          if-no-files-found: error
          retention-days: 30
