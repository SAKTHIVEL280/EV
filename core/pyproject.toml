[project]
name = "ev-core"
version = "0.1.0-beta.1"
description = "EV (Edge Voice) core: agent loop, tools, voice, memory and web, run as a sidecar of the EV desktop app."
readme = "README.md"
license = "Apache-2.0"
requires-python = "==3.12.*"
dependencies = [
    "aiohttp==3.14.5",
    "psutil==7.2.2",
    "pydantic==2.14.1",
    "tomlkit==0.15.2",
    "websockets==17.2",
    # Windows PC control (docs/decisions.md, beta 2 stage B).
    "comtypes==1.4.17; sys_platform == 'win32'",
    "mss==10.2.0; sys_platform == 'win32'",
    "pycaw==20260927; sys_platform == 'win32'",
    "pywinauto==0.6.9; sys_platform == 'win32'",
    "send2trash==2.1.0; sys_platform == 'win32'",
    # Voice: Moonshine speech recognition and Kokoro speech (docs/decisions.md, beta 2 stage C).
    "moonshine-voice==0.1.5",
    "sounddevice==0.5.6",
]

[project.scripts]
ev-core = "ev_core.__main__:main"

[dependency-groups]
dev = [
    "datamodel-code-generator==0.85.0",
    "jsonschema==4.26.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
    "types-jsonschema==4.26.0.20261006",
    "types-psutil==7.2.2.20260906",
]
package = [
    "pyinstaller==6.22.3",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]
# Transitive packages held at releases at least two weeks old (docs/decisions.md).
constraint-dependencies = ["certifi==2026.7.22", "filelock==4.1.0", "pycparser==3.11"]

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["ev_core/protocol/generated.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S", "PT", "RET", "PTH", "TRY", "BLE"]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# The Windows-only assert must precede the imports; the PowerShell script has long lines.
"ev_core/platform/windows_pc.py" = ["E402", "E501"]
"tests/test_windows_pc.py" = ["E402", "S101", "S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["ev_core", "tests", "../bench/honesty"]

[[tool.mypy.overrides]]
# Untyped Windows-only libraries (ev_core/platform/windows_pc.py).
module = [
    "pywinauto", "pywinauto.*", "pycaw", "pycaw.*", "comtypes", "comtypes.*", "send2trash",
    "mss", "mss.*", "moonshine_voice", "moonshine_voice.*", "sounddevice",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "../bench/honesty"]
addopts = "--strict-markers --strict-config -ra"
filterwarnings = [
    "error",
    # pywinauto 0.6.9 (latest) has a docstring with "\\;" in it; compile-time only.
    "ignore:invalid escape sequence:SyntaxWarning",
]

[tool.datamodel-codegen]
input = "../protocol/ev-protocol.schema.json"
input-file-type = "jsonschema"
output = "ev_core/protocol/generated.py"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.12"
custom-file-header = "# Generated from protocol/ev-protocol.schema.json. Do not edit; run scripts/codegen-protocol."
use-annotated = true
field-constraints = true
use-standard-collections = true
use-union-operator = true
use-double-quotes = true
disable-timestamp = true
use-schema-description = true
collapse-root-models = true
formatters = ["ruff-format"]
